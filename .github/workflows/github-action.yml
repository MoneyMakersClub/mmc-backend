name: CI/CD with Docker

on:
  push:
    branches: [ "deploy" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Prepare config files
        run: |
          mkdir -p ./bookduck/src/main/resources
          echo "${{ secrets.APPLICATION }}" > ./bookduck/src/main/resources/application.yml
          
      - name: Create Firebase Admin SDK JSON
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "bookduck-firebase-adminsdk.json"
          json: ${{ secrets.BOOKDUCK_FIREBASE_ADMINSDK_JSON }}
          dir: './bookduck/src/main/resources'

      - name: Create OCR Service Account JSON
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "mmc-bookduck-ocr.json"
          json: ${{ secrets.MMC_BOOKDUCK_OCR_JSON }}
          dir: './bookduck/src/main/resources'

      - name: Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('bookduck/**/*.gradle*', 'bookduck/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: |
          cd ./bookduck
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build & push
        uses: docker/build-push-action@v6
        with:
          context: ./bookduck
          file: ./bookduck/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ secrets.DOCKER_REPO }}:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            sudo docker compose pull app
            sudo docker compose up -d app
            sudo docker image prune -f
