name: CI/CD with Docker

on:
  push:
    branches: [ "deploy" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Make application.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.yml

      - name: Create firebase admin sdk JSON file
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "bookduck-firebase-adminsdk.json"
          json: ${{ secrets.BOOKDUCK_FIREBASE_ADMINSDK }}
          dir: './src/main/resources'
          
      - name: Create OCR JSON file
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "mmc-bookduck-ocr.json"
          json: ${{ secrets.OCR_JSON }}
          dir: './src/main/resources'

      - name: Check generated JSON files # 디버깅용
        run: ls -l ./src/main/resources

      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: |
          cd ./bookduck
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build & push
        uses: docker/build-push-action@v6
        with:
          context: ./bookduck
          file: ./bookduck/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKER_REPO }}:latest

      - name: Copy JSON files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "./src/main/resources/*"
          target: "/home/ubuntu/bookduck/src/main/resources/"

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          envs: GITHUB_SHA
          script: |
            sudo docker-compose -f /home/ubuntu/docker-compose.yml down --remove-orphans
            sudo docker pull ${{ secrets.DOCKER_REPO }}:latest
            sudo docker-compose -f /home/ubuntu/docker-compose.yml up -d --force-recreate
            sudo docker image prune -f
